name: CI y vista previa

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, build y captura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Instalar Chromium para la captura
        run: npx playwright install --with-deps chromium

      - name: Servir el build y capturar el juego
        run: |
          npm run preview -- --port 4173 > preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ > /dev/null && break
            sleep 1
          done
          node scripts/capture.mjs http://localhost:4173/

      - name: Subir capturas y video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-y-video
          path: artifacts/
          if-no-files-found: warn

      - name: Preparar publicación en Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    name: Publicar jugable en GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
