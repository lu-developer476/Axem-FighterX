name: CI y vista previa

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, build y captura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Confirmar sprites generados en main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/source/sprites/results/female art/source/sprites/results/male art/source/title.png art/source/sprites/references/axem-pink art/source/sprites/references/axem-red/axem-red-spritesheet.png art/source/sprites/references/axem-red/super-axem-red.png
          if git diff --cached --quiet; then
            echo "Los sprites generados ya están actualizados."
          elif [[ "$(git log -1 --pretty=%s)" == "Keep black male hair with brown Californian tips" || "$(git log -1 --pretty=%s)" == "Match male action GIF reference dimensions" || "$(git log -1 --pretty=%s)" == "Fix male ranger hair and remove duplicate sprite sheets" || "$(git log -1 --pretty=%s)" == "Fix blonde hair across all male poses" || "$(git log -1 --pretty=%s)" == "Fix false positive blonde hair test" || "$(git log -1 --pretty=%s)" == "Generate male orange action GIFs" || "$(git log -1 --pretty=%s)" == "Generate male violet action GIFs" || "$(git log -1 --pretty=%s)" == "Genera GIFs del Axem Violeta" || "$(git log -1 --pretty=%s)" == "Integra derrota y secuencia de invocación del Axem Naranja" || "$(git log -1 --pretty=%s)" == "Unifica la escala de los fotogramas de idle del Axem Violeta" || "$(git log -1 --pretty=%s)" == "Integra escenarios, tilesets y musica" || "$(git log -1 --pretty=%s)" == "Clasificar secuencias femeninas por fila en tiras compactas" || "$(git log -1 --pretty=%s)" == "Completar limpieza de tiras femeninas" || "$(git log -1 --pretty=%s)" == "Separar las poses compuestas del atlas femenino" ]]; then
            # El commit de esta tarea incorpora también los assets generados: se conserva un único commit en main.
            git commit --amend --no-edit
            git push --force-with-lease origin HEAD:main
          else
            git commit -m "Actualizar sprites y paletas de Axem Rangers"
            git push origin HEAD:main
          fi

      - name: Instalar Chromium para la captura
        run: npx playwright install --with-deps chromium

      - name: Servir el build y capturar el juego
        run: |
          npm run preview -- --port 4173 > preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ > /dev/null && break
            sleep 1
          done
          node scripts/capture.mjs http://localhost:4173/

      - name: Adjuntar sprites procesados para revisión
        if: always()
        run: |
          mkdir -p artifacts/sprites-review
          cp -R art/source/sprites/results/female artifacts/sprites-review/
          cp -R art/source/sprites/results/male artifacts/sprites-review/
          mkdir -p artifacts/sprites-review/generated
          cp public/generated/axem-*.png artifacts/sprites-review/generated/ 2>/dev/null || true

      - name: Subir capturas y video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-y-video
          path: artifacts/
          if-no-files-found: warn

      - name: Preparar publicación en Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    name: Publicar jugable en GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
