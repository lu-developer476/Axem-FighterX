name: CI y vista previa

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, build y captura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7

      - name: Instalar HaxeFlixel
        run: |
          haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib install flixel --quiet
          haxelib run lime setup -y

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Preparar y compilar minijuegos HaxeFlixel
        run: |
          npm run prepare:haxe-assets
          npm run build:haxe
          test -s public/minigames/index.html || { echo "No se generó public/minigames/index.html"; exit 1; }

      - name: Tests
        run: npm test

      - name: Exportar GIF manuales para verificación visual
        run: |
          for file in \
            art/source/effects/axem/big-white-explotion.gif \
            art/source/effects/axem/white-explotion.gif \
            art/source/effects/canon/normal-canon-shoot.gif \
            art/source/effects/canon/special-canon-shoot.gif \
            art/source/effects/canon/turquoise-canon-shoot.gif \
            art/source/effects/sparks/turquoise-effect.gif \
            art/source/effects/sparks/yellow-effect.gif; do
            printf '\\n__AXEM_GIF_BEGIN__%s\\n' "$file"
            base64 -w0 "$file"
            printf '\\n__AXEM_GIF_END__\\n'
          done

      - name: Build
        run: npm run build

      - name: Verificar que Vite incluye los minijuegos HTML5
        run: test -s dist/minigames/index.html

      - name: Instalar Chromium para la captura
        run: npx playwright install --with-deps chromium

      - name: Servir el build y capturar el juego
        run: |
          npm run preview -- --port 4173 > preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ > /dev/null && break
            sleep 1
          done
          node scripts/capture.mjs http://localhost:4173/

      - name: Adjuntar sprites procesados para revisión
        if: always()
        run: |
          mkdir -p artifacts/sprites-review
          cp -R art/source/sprites/results/female artifacts/sprites-review/
          cp -R art/source/sprites/results/male artifacts/sprites-review/
          mkdir -p artifacts/sprites-review/generated
          cp public/generated/axem-*.png artifacts/sprites-review/generated/ 2>/dev/null || true

      - name: Subir capturas y video
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: capturas-y-video
          path: artifacts/
          if-no-files-found: warn

      - name: Preparar publicación en Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  wait-for-legacy-pages:
    name: Esperar al publicador automático de Jekyll
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Esperar a que termine la publicación automática de Jekyll
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # CI no escribe en main: el workflow Jekyll esperado corresponde al SHA inmutable del evento.
          expected_sha="$GITHUB_SHA"
          legacy_run=""
          # El workflow generado de Pages puede aparecer unos segundos después del push.
          # Esta espera no reserva el entorno github-pages: deja libre el despliegue de Jekyll.
          for attempt in $(seq 1 12); do
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&per_page=100")"
            legacy_run="$(jq -r --arg sha "$expected_sha" '
              [.workflow_runs[]
                | select(.head_sha == $sha and .path == "dynamic/pages/pages-build-deployment")]
              | max_by(.created_at)
              | .id // empty
            ' <<< "$runs")"
            if [[ -n "$legacy_run" ]]; then break; fi
            sleep 5
          done

          if [[ -z "$legacy_run" ]]; then
            echo "No se detectó un build Jekyll paralelo; continúa la publicación normal."
            exit 0
          fi

          echo "Esperando el workflow Jekyll $legacy_run para el commit $expected_sha."
          for attempt in $(seq 1 120); do
            run_state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$legacy_run")"
            status="$(jq -r '.status' <<< "$run_state")"
            conclusion="$(jq -r '.conclusion // ""' <<< "$run_state")"

            if [[ "$status" == "completed" ]]; then
              if [[ "$conclusion" != "success" ]]; then
                echo "El build Jekyll paralelo terminó con estado: $conclusion"
                exit 1
              fi
              echo "Jekyll terminó. Ahora el job siguiente puede publicar el build Vite de dist."
              exit 0
            fi

            sleep 5
          done

          echo "El workflow Jekyll no terminó dentro del tiempo esperado."
          exit 1

  deploy-pages:
    name: Publicar jugable en GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: [build, wait-for-legacy-pages]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
