name: Restaurar publicación compilada de Axem FighterX

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pages-restore-main
  cancel-in-progress: false

jobs:
  restore:
    name: Re-publicar el build de Vite
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener el commit que disparó Pages
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Compilar el juego para producción
        run: npm run build

      - name: Adjuntar el sitio compilado
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Restaurar la publicación correcta
        id: deployment
        uses: actions/deploy-pages@v4
