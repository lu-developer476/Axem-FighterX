name: Verificación del sistema de combate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-direct-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Teclado, combos, animaciones y combate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      # Ejecuta las pruebas del flujo modificado sin depender de la generación de sprites.
      - name: Ejecutar pruebas de controles y asignaciones
        run: >-
          npx vitest run
          src/infrastructure/assets/assetStandards.test.js
          src/infrastructure/input/PhaserKeyboardInput.test.js
          src/domain/match/playerAssignments.test.js
          src/application/useCases/CreateMatch.test.js
          src/domain/match/matchModes.test.js
          src/domain/entities/Fighter.test.js
          src/domain/entities/Match.test.js
          src/presentation/animation/FighterAnimator.test.js
          src/infrastructure/assets/stageAssetManifest.test.js
          src/infrastructure/assets/raceCourseAssets.test.js
          src/infrastructure/assets/terrestrialRaceMaps.test.js
