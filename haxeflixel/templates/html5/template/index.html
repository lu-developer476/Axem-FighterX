<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>::APP_TITLE_HTML::</title>
  <meta id="viewport" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/gif" href="./favicon.gif">

  ::if favicons::::foreach (favicons)::
  <link rel="::__current__.rel::" type="::__current__.type::" href="::__current__.href::">
  ::end::::end::

  ::if linkedLibraries::::foreach (linkedLibraries)::
  <script type="text/javascript" src="::__current__::"></script>
  ::end::::end::
  <script type="text/javascript" src="./::APP_FILE::.js"></script>
  <script type="text/javascript" src="./minigame-bootstrap.js"></script>

  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    #content { ::if (WIN_BACKGROUND)::background: #000000; ::end::width: 100%; height: 100%; overflow: hidden; }
    #content canvas { display: block; width: 100% !important; height: 100% !important; image-rendering: pixelated; }
    ::foreach assets::::if (type == "font")::::if (cssFontFace)::::cssFontFace::::end::::end::::end::
  </style>
</head>
<body>
  ::foreach assets::::if (type == "font")::
  <span style="font-family: ::id::"> </span>
  ::end::::end::

  <div id="content"></div>
</body>
</html>
