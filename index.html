<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0b16" />
    <link rel="icon" type="image/gif" sizes="48x48" href="./favicon.gif?v=2" />
    <!-- PNG queda último para tener prioridad frente al GIF en navegadores que eligen el último candidato compatible. -->
    <link rel="icon" type="image/png" sizes="48x48" href="./favicon.png?v=2" />
    <title>Axem FighterX</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #0d0b16;
        overflow: hidden;
      }
      #game {
        width: 100%;
        height: 100%;
        overflow: hidden;
        image-rendering: pixelated;
      }
      #game canvas {
        display: block;
        image-rendering: pixelated !important;
        image-rendering: crisp-edges !important;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
