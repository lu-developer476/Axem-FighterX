<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0b16" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon.png?v=4" />
    <!-- El GIF va último: con íconos del mismo tamaño, Chrome elige el último candidato compatible. El PNG queda como respaldo. -->
    <link rel="icon" type="image/gif" sizes="32x32" href="./favicon.gif?v=4" />
    <title>Axem FighterX</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #0d0b16;
        overflow: hidden;
      }
      #game {
        width: 100%;
        height: 100%;
        overflow: hidden;
        image-rendering: pixelated;
      }
      #game canvas {
        display: block;
        image-rendering: pixelated !important;
        image-rendering: crisp-edges !important;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
